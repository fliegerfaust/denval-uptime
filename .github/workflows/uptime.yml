# Внешняя проверка, что сайт открывается. Алерт — в Telegram через бота школы.
#
# Расписание GitHub — «когда сможем»: запуск задерживается на 5–15 минут при
# нагрузке. Для «сайт лежит» это приемлемо, и обещать минуту точности нельзя.
name: uptime

on:
  schedule:
    # Каждые 15 минут — сама проверка.
    - cron: "*/15 * * * *"
    # Понедельник, 06:07 UTC — «пульс» репозитория: GitHub отключает расписание
    # там, где 60 дней ничего не происходит, и молчащий мониторинг был бы худшим
    # исходом из возможных.
    - cron: "7 6 * * 1"
  # Кнопкой — чтобы проверить настройку, не дожидаясь четверти часа.
  workflow_dispatch:

# Нужно записывать state.txt: он и есть память между запусками.
permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Спросить health
        id: probe
        run: |
          set +e
          body=$(curl -sS -m 20 -w '\n%{http_code}' https://denvalclass.ru/api/health)
          rc=$?
          set -e

          code=$(printf '%s' "$body" | tail -n1)
          text=$(printf '%s' "$body" | sed '$d')

          if [ "$rc" != "0" ]; then
            echo "state=down" >> "$GITHUB_OUTPUT"
            echo "reason=сервер не отвечает вовсе (curl $rc)" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "200" ] || ! printf '%s' "$text" | grep -q '"ok":true'; then
            echo "state=down" >> "$GITHUB_OUTPUT"
            echo "reason=ответил $code" >> "$GITHUB_OUTPUT"
          else
            echo "state=up" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
          fi

      - name: Сообщить, если состояние изменилось
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NOW: ${{ steps.probe.outputs.state }}
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          WAS=$(cat state.txt 2>/dev/null || echo up)
          echo "было: $WAS · стало: $NOW"

          # Сообщение — только на СМЕНЕ состояния. Иначе за ночь падения
          # набежало бы под сорок одинаковых, и читать их перестанут.
          if [ "$WAS" = "$NOW" ]; then
            echo "состояние не изменилось — молчим"
            exit 0
          fi

          # Текст — ОДНОЙ строкой: перенос внутри YAML-блока обязан быть
          # отбит отступом, а строка с первой колонки обрывает блок и делает
          # весь файл невалидным. На этом уже поймал GitHub.
          if [ "$NOW" = "down" ]; then
            TEXT="🔴 denvalclass.ru не отвечает: $REASON. Ученики сейчас не могут зайти — проверьте сервер в панели Timeweb, обычно помогает перезапуск контейнеров."
          else
            TEXT="🟢 denvalclass.ru снова открывается. Всё в порядке."
          fi

          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::секреты TG_BOT_TOKEN/TG_CHAT_ID не заданы — сообщение не ушло"
          else
            curl -sS -m 20 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              -d link_preview_options='{"is_disabled":true}' >/dev/null
          fi

          printf '%s\n' "$NOW" > state.txt

      - name: Отметить «пульс» репозитория по понедельникам
        if: github.event.schedule == '7 6 * * 1'
        run: date -u +'%Y-%m-%d %H:%M UTC' > heartbeat.txt

      - name: Запомнить состояние
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(uptime): $(cat state.txt)"
            git push
          fi
